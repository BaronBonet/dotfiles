["powerlevel10k"]
    type = "archive"
    url = "https://github.com/romkatv/powerlevel10k/archive/master.tar.gz"
    refreshPeriod = "168h"
    exact = true
    stripComponents = 1

[".config/zsh/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/master.tar.gz"
    refreshPeriod = "168h"
    exact = true
    stripComponents = 1

[".config/zsh/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/master.tar.gz"
    refreshPeriod = "168h"
    exact = true
    stripComponents = 1

[".config/zsh/plugins/zsh-completions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-completions/archive/master.tar.gz"
    refreshPeriod = "168h"
    exact = true
    stripComponents = 1

[".config/zsh/plugins/fzf-tab"]
    type = "archive"
    url = "https://github.com/Aloxaf/fzf-tab/archive/master.tar.gz"
    refreshPeriod = "168h"
    exact = true
    stripComponents = 1

{{ if eq .chezmoi.os "darwin" -}}
[".asdf"]
    type = "archive"
    url = "https://github.com/asdf-vm/asdf/archive/master.tar.gz"
    refreshPeriod = "168h"
    exact = true
    stripComponents = 1
{{ end -}}

{{ if eq .chezmoi.os "linux" -}}
# On darwin zsh-vi-mode comes from brew (see plugins/vim_mode)
[".config/zsh/plugins/zsh-vi-mode"]
    type = "archive"
    url = "https://github.com/jeffreytse/zsh-vi-mode/archive/master.tar.gz"
    refreshPeriod = "168h"
    exact = true
    stripComponents = 1

# Tools where apt is too old or missing. Versions live in .chezmoidata/packages.yaml.
{{ $v := .packages.linux.external_versions -}}
[".local/nvim"]
    type = "archive"
    url = "https://github.com/neovim/neovim/releases/download/v{{ $v.neovim }}/nvim-linux-x86_64.tar.gz"
    exact = true
    stripComponents = 1

[".local/bin/lsd"]
    type = "archive-file"
    url = "https://github.com/lsd-rs/lsd/releases/download/v{{ $v.lsd }}/lsd-v{{ $v.lsd }}-x86_64-unknown-linux-gnu.tar.gz"
    path = "lsd-v{{ $v.lsd }}-x86_64-unknown-linux-gnu/lsd"
    executable = true

[".local/bin/delta"]
    type = "archive-file"
    url = "https://github.com/dandavison/delta/releases/download/{{ $v.delta }}/delta-{{ $v.delta }}-x86_64-unknown-linux-gnu.tar.gz"
    path = "delta-{{ $v.delta }}-x86_64-unknown-linux-gnu/delta"
    executable = true

[".local/bin/zoxide"]
    type = "archive-file"
    url = "https://github.com/ajeetdsouza/zoxide/releases/download/v{{ $v.zoxide }}/zoxide-{{ $v.zoxide }}-x86_64-unknown-linux-musl.tar.gz"
    path = "zoxide"
    executable = true

[".local/bin/tms"]
    type = "archive-file"
    url = "https://github.com/jrmoulton/tmux-sessionizer/releases/download/v{{ $v.tmux_sessionizer }}/tmux-sessionizer-x86_64-unknown-linux-gnu.tar.xz"
    path = "tmux-sessionizer-x86_64-unknown-linux-gnu/tms"
    executable = true

[".local/bin/fastfetch"]
    type = "archive-file"
    url = "https://github.com/fastfetch-cli/fastfetch/releases/download/{{ $v.fastfetch }}/fastfetch-linux-amd64.tar.gz"
    path = "fastfetch-linux-amd64/usr/bin/fastfetch"
    executable = true

[".local/bin/gh"]
    type = "archive-file"
    url = "https://github.com/cli/cli/releases/download/v{{ $v.gh }}/gh_{{ $v.gh }}_linux_amd64.tar.gz"
    path = "gh_{{ $v.gh }}_linux_amd64/bin/gh"
    executable = true

[".local/bin/fzf"]
    type = "archive-file"
    url = "https://github.com/junegunn/fzf/releases/download/v{{ $v.fzf }}/fzf-{{ $v.fzf }}-linux_amd64.tar.gz"
    path = "fzf"
    executable = true
{{ end -}}

